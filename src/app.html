<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#141312" />
		<meta name="description" content="NAAD — a self-hosted, quality-first music player." />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="apple-touch-icon" href="/icons/icon-192.png" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<title>NAAD</title>
		<script>
			// Applied before first paint so a saved theme never flashes the wrong one.
			(() => {
				var t;
				try {
					t = localStorage.getItem('naad:theme');
				} catch {
					/* private browsing / storage disabled: fall through to the system preference */
				}
				if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
